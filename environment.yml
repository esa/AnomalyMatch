name: am
channels:
  - conda-forge
dependencies:
  - astropy
  - dotmap
  - h5py
  - ipykernel
  - ipywidgets
  - loguru
  - matplotlib
  - numpy
  - pandas<3
  - psutil
  - pyarrow
  - python=3.11
  - pytorch>=2.6
  - pytorch-gpu
  # CUDA driver/runtime headers (cuda.h). The runtime cuda-cudart ships without
  # them, so torch.compile/Triton can't build kernels (gcc: "cuda.h: No such
  # file"). Headers only — no root, no driver change. Required to enable
  # cfg.compile_model; harmless otherwise.
  - cuda-cudart-dev
  - cuda-driver-dev
  - pyturbojpeg
  - scikit-image
  - scikit-learn
  - scipy
  - threadpoolctl
  - toml
  - torchvision
  - tqdm
  - zarr>=3.0.0b0
  - pip
  - pip:
      - albumentations
      - cutana>=0.4.0
      - fitsbolt>=0.3.1,<0.4
      - opencv-python-headless
      - safetensors
      - timm
