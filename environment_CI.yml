name: am
channels:
  - conda-forge
  - pytorch
dependencies:
  - astropy
  - dotmap
  - h5py
  - imageio
  - ipykernel
  - ipywidgets
  - loguru
  - matplotlib
  - numpy
  - pandas<3
  - python=3.11
  - pytorch>=2.6
  - pytest
  - pytest-cov
  - pytest-asyncio>=0.23.0
  - pyturbojpeg
  - scikit-learn
  - scikit-image
  - toml
  - torchvision
  - tqdm
  - zarr>=3.0.0b0
  - pip
  - pip:
      - opencv-python-headless
      - albumentations
      - safetensors
      - timm
      # fitsbolt and Cutana are both installed in .github/workflows/run_tests.yml,
      # not here, so micromamba can't pull a stale PyPI release that would shadow
      # them. fitsbolt is pinned to >=0.3.1,<0.4 there, after Cutana, so a Cutana
      # release with a narrower pin cannot downgrade it. Cutana is installed by the
      # ./.github/actions/install-cutana composite action, which picks the source
      # from the PR target branch (PyPI for main; the Cutana develop branch via
      # the CUTANA_REPO_READ_TOKEN secret otherwise).
      - voila>=0.5
      - playwright>=1.40
