[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly_match"
version = "1.3.2"
description = "A tool for anomaly detection in images using semi-supervised and active learning with a GUI"
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.11"
authors = [{ name = "European Space Agency" }]
keywords = [
    "anomaly-detection",
    "machine-learning",
    "computer-vision",
    "active-learning",
    "semi-supervised",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    "albumentations",
    "astropy",
    "cutana>=0.3.0",
    "dotmap",
    "fitsbolt>=0.2",
    "h5py",
    "ipykernel",
    "ipywidgets",
    "loguru",
    "matplotlib",
    "numpy",
    "opencv-python-headless",
    "pandas<3",
    "psutil",
    "pyarrow",
    "pyturbojpeg",
    "safetensors",
    "scikit-image",
    "scikit-learn",
    "scipy",
    "timm",
    "toml",
    "torch",
    "torchvision",
    "tqdm",
    "zarr>=3.0.0b0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "ruff", "mypy", "vulture>=2.10"]

[tool.setuptools.packages.find]
include = ["anomaly_match*"]

[tool.setuptools.package-dir]
"" = "."

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E402", "E203", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["anomaly_match", "anomaly_match_ui"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: tests that train models or take >10s (skip with -m 'not slow')",
    "ui: tests requiring ipywidgets/Jupyter",
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.vulture]
min_confidence = 60
paths = ["anomaly_match", "anomaly_match_ui"]
exclude = ["tests/", "docs/", "examples/", "paper_scripts/"]
