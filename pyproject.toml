[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly_match"
version = "2.0.0"
description = "A tool for anomaly detection in images using semi-supervised and active learning with a GUI"
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.11"
authors = [{ name = "European Space Agency" }]
keywords = [
    "anomaly-detection",
    "machine-learning",
    "computer-vision",
    "active-learning",
    "semi-supervised",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    "albumentations",
    "astropy",
    "cutana>=0.4.0",
    "dotmap",
    "filelock",
    # 0.3.1 rather than 0.3.0: 0.3.0 evaluates len(cfg.fits_extension) before its
    # `is not None` guard, crashing every load path without FITS extensions.
    "fitsbolt>=0.3.1,<0.4",
    "ipyfilechooser",
    "ipykernel",
    "ipywidgets",
    "loguru",
    "matplotlib",
    "numpy",
    "opencv-python-headless",
    "pandas<3",
    "pillow",
    "psutil",
    "pyarrow",
    "safetensors",
    "scikit-image",
    "scikit-learn",
    "scipy",
    "threadpoolctl",
    "timm",
    "toml",
    "torch>=2.6",
    "torchvision",
    "tqdm",
    "zarr>=3.0.0b0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "ruff", "mypy", "vulture>=2.10", "pydoclint"]

# A dependency *group* (PEP 735), not an extra: an extra is additive to the
# project, so installing it would drag in torch and the rest of the runtime
# stack. The docs build needs none of that (``allow_inspection = false``), and a
# group can be installed on its own — which is what lets CI read its versions
# from here instead of repeating them in the workflow.
[dependency-groups]
docs = [
    "zensical>=0.0.50",
    "mkdocstrings[python]",
    # Upstream mike shells out to `mkdocs build`; squidfunk's fork builds with
    # Zensical instead. Pinned to a commit because the fork is unreleased.
    "mike @ git+https://github.com/squidfunk/mike.git@2d4ad799442f4592db8ad53b179bfb33db8c69ac",
]

[tool.setuptools.packages.find]
include = ["anomaly_match*", "assets"]

[tool.setuptools.package-data]
assets = ["*.svg", "*.png"]

[tool.setuptools.package-dir]
"" = "."

[tool.ruff]
line-length = 100
target-version = "py311"
# v1 paper plotting code reused for the v2 benchmark, excluded from lint/format to
# keep it close to upstream and avoid churn on the large figure functions.
# ``_reference_v1`` and ``plot_colors.py`` are verbatim copies; ``paper_plots.py``
# is a light adaptation (package-relative imports fixed, ``save_plot_data`` inlined)
# that keeps the v1 figure code and its many paper-specific (currently unused)
# helpers intact rather than diverging from the published plots.
extend-exclude = [
    "paper_scripts/v2/_reference_v1",
    "paper_scripts/v2/paper_plots.py",
    "paper_scripts/v2/plot_colors.py",
]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = ["E", "F", "W", "I", "D", "DOC201", "DOC402", "DOC501", "DOC502", "PLC0415"]
ignore = ["E402", "E203", "E501", "D105", "D107", "D200"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "DOC", "PLC0415"]
"prediction_*.py" = ["D", "DOC"]
"utility_scripts/**" = ["D", "DOC"]
"scripts/**" = ["D", "DOC", "PLC0415"]
"subprocess_scripts/**" = ["D", "DOC"]
".vulture_whitelist.py" = ["D", "DOC"]

[tool.ruff.lint.isort]
known-first-party = ["anomaly_match", "anomaly_match_ui", "prediction_utils"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = [".", "subprocess_scripts"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: tests that train models or take >10s (skip with -m 'not slow')",
    "ui: tests requiring ipywidgets/Jupyter",
    "browser: Playwright browser tests via Voila (skip with -m 'not browser')",
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
exclude = '\.git|tests|utility_scripts|scripts|subprocess_scripts|prediction_'
baseline = ".pydoclint-baseline"

[tool.vulture]
min_confidence = 60
paths = ["anomaly_match", "anomaly_match_ui", "subprocess_scripts"]
exclude = ["tests/", "docs/", "examples/"]
